# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Justin Lewis
email: j.mapping@gmail.com
description: >-
  Justin Lewis is VP of Product & Senior GIS Developer at TerraFrame, building
  open geospatial data infrastructure, and founder of West Slope Technologists.
baseurl: "" # the subpath of your site, e.g. /blog
lang: "en"
url: "https://www.jmapping.com" # the base hostname & protocol for your site
twitter_username: jmapping
github_username:  justinlewis

# Build settings
markdown: kramdown

exclude: [README.md, LICENSE]

# Theme settings
compress_html:
  comments: ["<!-- ", " -->"]
  clippings: all
  endings: all


sass:
  sass_dir: assets/_sass
  style: compressed


images: '/assets/images'
